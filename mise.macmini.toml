# Profile: macmini, the Mac mini for web and mobile development. You use it
# mostly through SSH, and sometimes at its monitor. It uses mise.toml and
# mise.macos.toml as they are, with the apps of the root Brewfile only. It has
# no dictation apps, no Synology Drive, no Mackup, and no T3 Code desktop app.
# The T3 server runs as a login service: see the t3 row in apps/standalone.tsv
# and bin/setup-t3-service. bin/configure-remote-access turns on Remote Login
# and automatic login, and stops system sleep. A login job locks the screen
# after automatic login. It has no runtime tools of its
# own: it uses the list in configs/mise/config/config.toml.

[dotfiles]
"~/bin/dotfiles-lock-screen" = { source = "bin/lock-screen", mode = "symlink" }

# Automatic login shows the desktop with no password. This job locks the screen
# right after login, and the session stays active behind the lock. launchd does
# not expand ~ or $HOME in a program path, so /bin/sh finds the script.
# bin/configure-telemetry applies it.
[bootstrap.macos.launchd.agents.lock-screen]
program = "/bin/sh"
args = ["-c", 'exec "$HOME/bin/dotfiles-lock-screen"']
run_at_load = true

# Vorssaint fan curve for the Mac mini (M4, one fan). The fan stays at its
# lowest speed to 50 °C, so the machine is silent at idle. It reaches full speed
# at 98 °C, below the temperature where the chip reduces its speed. The sensor
# is the CPU average, so a short load peak does not make the fan pulse. The
# shared Vorssaint preferences are in mise.macos.toml.
[bootstrap.macos.defaults."com.vorssaint.utils"]
fanControlMode = "curve"
fanControlCoolingLevel = 100
fanControlCurves = '[{"points":[{"coolingLevel":0,"temperature":50},{"coolingLevel":25,"temperature":65},{"coolingLevel":45,"temperature":75},{"coolingLevel":65,"temperature":85},{"coolingLevel":85,"temperature":92},{"coolingLevel":100,"temperature":98}],"sensor":"averageCPU"}]'
# Vorssaint starts with this saved configuration, so it holds the same curve.
fanControlResume = true
fanControlResumeConfiguration = '{"curves":[{"points":[{"coolingLevel":0,"temperature":50},{"coolingLevel":25,"temperature":65},{"coolingLevel":45,"temperature":75},{"coolingLevel":65,"temperature":85},{"coolingLevel":85,"temperature":92},{"coolingLevel":100,"temperature":98}],"sensor":"averageCPU"}],"manualLevel":100,"mode":"curve"}'
