[dotfiles]
"~/.zshenv" = { source = "zshenv", mode = "symlink" }
"~/.zprofile" = { source = "zprofile", mode = "symlink" }
"~/.zshrc" = { source = "zshrc", mode = "symlink" }
"~/.p10k.zsh" = { source = "p10k.zsh", mode = "symlink" }
"~/.config/zsh/aliases.zsh" = { source = "aliases.zsh", mode = "symlink" }
"~/.config/zsh/check-updates.zsh" = { source = "check-updates.zsh", mode = "symlink" }
"~/.config/zsh/env.zsh" = { source = "env.zsh", mode = "symlink" }
"~/.config/zsh/functions.zsh" = { source = "functions.zsh", mode = "symlink" }
"~/.config/zsh/harness.zsh" = { source = "harness.zsh", mode = "symlink" }
"~/.config/zsh/interactive.zsh" = { source = "interactive.zsh", mode = "symlink" }
"~/.config/zsh/mise-npx.zsh" = { source = "mise-npx.zsh", mode = "symlink" }
"~/.config/zsh/path.zsh" = { source = "path.zsh", mode = "symlink" }
"~/.config/zsh/profile.zsh" = { source = "profile.zsh", mode = "symlink" }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-fzf-history-search" = { url = "https://github.com/joshskidmore/zsh-fzf-history-search.git", depth = 1 }
