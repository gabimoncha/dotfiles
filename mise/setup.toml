# Setup-only mise config. bin/repo-mise loads it as the only global config, so
# the linked ~/.config/mise/config.toml stays readable by an older mise.
min_version = "2026.10.17"

# Shell framework and tmux plugin manager. install_shell_framework in
# bin/bootstrap clones only the missing paths, in this order, and leaves
# existing checkouts as they are. Keep each parent before the paths inside it.
# The plugin paths follow ZSH_CUSTOM, as home/.config/zsh/interactive.zsh does.
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-fzf-history-search" = { url = "https://github.com/joshskidmore/zsh-fzf-history-search.git", depth = 1 }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm", depth = 1 }

# Drift report for ./bin/link-dotfiles --status. bin/link-dotfiles still writes
# these files and backs up what it replaces. Keep this list and its lists in sync.
# An entry without source reads home/<path relative to HOME>.
[dotfiles]
"~/.zshenv" = { mode = "symlink" }
"~/.zprofile" = { mode = "symlink" }
"~/.zshrc" = { mode = "symlink" }
"~/.p10k.zsh" = { mode = "symlink" }
"~/.mackup.cfg" = { mode = "symlink" }
"~/.gitconfig" = { mode = "symlink" }
"~/bin/harness" = { mode = "symlink" }
"~/bin/gh" = { mode = "symlink" }
"~/bin/dotfiles-gh-real" = { mode = "symlink" }
"~/bin/dotfiles-telemetry-env" = { mode = "symlink" }
"~/.rgrc" = { mode = "symlink" }
"~/.tmux.conf" = { mode = "symlink" }
"~/.cli-proxy-api/config.yaml" = { mode = "symlink" }
"~/.config/mise/config.toml" = { mode = "symlink" }
"~/.config/mise/gemrc" = { mode = "symlink" }
"~/.config/mise/mise.lock" = { mode = "symlink" }
"~/.config/tsrs/tsgo" = { mode = "symlink" }
"~/.config/telemetry/env.sh" = { mode = "symlink" }
"~/.config/zsh/env.zsh" = { mode = "symlink" }
"~/.config/zsh/profile.zsh" = { mode = "symlink" }
"~/.config/zsh/interactive.zsh" = { mode = "symlink" }
"~/.config/zsh/path.zsh" = { mode = "symlink" }
"~/.config/zsh/aliases.zsh" = { mode = "symlink" }
"~/.config/zsh/harness.zsh" = { mode = "symlink" }
"~/.config/zsh/mise-npx.zsh" = { mode = "symlink" }
"~/.config/zsh/functions.zsh" = { mode = "symlink" }
"~/.config/zsh/check-updates.zsh" = { mode = "symlink" }
"~/.config/karabiner/karabiner.json" = { mode = "symlink" }
"~/Documents/superwhisper/settings/settings.json" = { mode = "symlink" }
"~/scripts/toggle_function_keys.sh" = { mode = "symlink" }
"~/.config/nvim" = { source = "../nvim", mode = "symlink" }
# Linked only when AeroSpace.app and Ghostty.app are installed.
"~/.aerospace.toml" = { mode = "symlink" }
"~/Library/Application Support/com.mitchellh.ghostty/config" = { mode = "symlink" }
"~/.codex/AGENTS.md" = { mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "../home/.codex/AGENTS.md", mode = "symlink" }
# configure-telemetry compares this copy to reload a changed login job.
"~/Library/LaunchAgents/com.dotfiles.telemetry-env.plist" = { mode = "copy" }

# Keys that the repo owns in agent settings that the agents also rewrite.
# bin/link-dotfiles backs up a changed file, then runs `mise dot apply` for these
# two targets only. mise sets these keys and keeps every other key.
"~/.claude/settings.json/dotfiles" = { source = "../home/.claude/settings.json", merge = true }
# mise does not render templates in [dotfiles] keys, so CODEX_HOME is not used.
"~/.codex/config.toml/dotfiles" = { source = "../home/.codex/config.toml", merge = true }
