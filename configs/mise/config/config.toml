# An older mise cannot parse self_update.minimum_release_age. With this floor it
# stops with an upgrade message. Run ./bin/install-standalone mise to install the pin.
min_version = "2026.11.8"

[tools]
# Tools for every host, the MacBook Air too. The development machines add
# config.devhost.toml, and a profile adds config.<profile>.toml. Each file has
# its own lock: mise.lock, mise.devhost.lock, and mise.<profile>.lock.
# Mac and Linux. Node.js 26 ships no Corepack, and mise enables Corepack only
# with node.corepack, so the pnpm and npm entries own those commands.
pnpm = "latest"
npm = "12.2.1"
# Security exception to the four-day delay: 26.13.1 fixes the November
# Node.js advisories, including CVE-2026-123863 and CVE-2026-123872.
node = "26.13.1"
# Security exception to the four-day delay: 3.8.1 fixes CVE-2026-105802,
# CVE-2026-105803, CVE-2026-69260, and CVE-2026-69261.
git-lfs = "3.8.1"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
lazygit = "latest"
tmux = "latest"
jq = "latest"
gh = "2.103.3"
bat = "latest"
eza = "0.23.5"
zoxide = "latest"
neovim = "latest"
# Builds the parsers for nvim-treesitter in the Neovim config (configs/nvim).
"npm:tree-sitter-cli" = "latest"
# TypeScript checks, and the language server for Neovim and Cursor
# (~/.config/tsrs/tsgo).
"npm:tsrs" = "latest"
# Lint and format JavaScript, TypeScript, and Markdown in Neovim, Cursor, and
# the repos whose hk.pkl runs them, including this one.
"npm:oxlint" = "latest"
"npm:oxfmt" = "latest"
# Searches and rewrites code by its syntax tree.
ast-grep = "latest"
# Drives iOS simulators and Android devices for the agents and the T3 device hub.
"npm:agent-device" = "latest"
"npm:sfw" = "latest"
age = "latest"
# Security exception to the four-day delay: the lock selects 4.54.3 for
# GHSA-c3cc-5w96-mw9r, GHSA-9fvq-9qj8-6qhx, and GHSA-h2cv-65fq-jgrp.
yq = "latest"
# Git hooks for repos with an hk.pkl, including this one.
hk = "latest"
# Every Mac.
fastfetch = { version = "latest", os = "macos" }
mas = { version = "latest", os = "macos" }
"conda:wget" = { version = "latest", os = "macos" }
# Drives a browser for the agents. Linux hosts have no browser.
"npm:agent-browser" = { version = "latest", os = "macos" }

[settings]
experimental = true
# Activated shells (configs/zsh/mise-activate.zsh) never install a missing tool
# when a command is not found. Setup and `mise install` install tools.
not_found_auto_install = false
# Activation does not add the shims folder to PATH, also when a project
# declares a lazy tool. configs/claude/claude puts it on the PATH of Claude Code.
activate_shims = false
# A shim whose version is not installed stops with an error. It does not run
# another executable of that name, such as /usr/bin/python3.
not_found_system_fallback = false
# mise refuses an unregistered community plugin that is asked for by its
# short name. A full plugin URL still installs.
paranoid = ["plugins"]
# No tool here uses an asdf plugin. mise then never installs a tool with one.
disable_backends = ["asdf"]
# `mise exec` and `mise run` install missing tools from every config layer,
# including the profile tools of this repository. In a project, a large profile
# tool then blocks each `mise exec` call. Only `mise install` installs these
# tools. Use the full backend name, such as `github:owner/repo`.
auto_install_disable_tools = ["ollama"]
# The repository root holds a mise.toml. Trust it, so tools work in that folder.
# Work and client projects are trusted too. ~/code/contrib and ~/code/ref hold
# other people's repositories, so mise asks before it loads a config there.
trusted_config_paths = ["~/code/personal/dotfiles", "~/code/work", "~/code/client"]
# Linux boxes install from the same lockfile.
lockfile_platforms = ["macos-arm64", "linux-x64"]
use_versions_host_track = false
# Codex CLI is vendor-owned. Ignore old project or shell version requests too.
disable_tools = ["codex", "aqua:openai/codex", "npm:@openai/codex"]
minimum_release_age = "4d"
# Entries match a full backend ID, a registry short name, or a backend wildcard.
# bun installs the npm: tools and has its own delay. Add each npm: entry to
# minimumReleaseAgeExcludes in configs/bun/bunfig.toml too.
minimum_release_age_excludes = [
  "npm:cf",
  "npm:eas-cli",
  "npm:agent-browser",
  "npm:agent-desktop",
  "npm:agent-device",
  "npm:tokenburnmarket",
  "npm:oh-my-t3",
  "npm:omt3",
  "npm:t3",
  "github:flowcopilot/aether",
  # Code checks run the newest release, so a project and the editor agree.
  "npm:oxlint",
  "npm:oxfmt",
  "npm:tsrs",
  "npm:tla-ts",
  "npm:fallow",
  "npm:react-doctor",
  "hk",
]

[settings.npm]
package_manager = "bun"

# Activated shells define these aliases, in zsh and bash, for people and agents.
# configs/zsh/aliases.zsh keeps two groups for interactive zsh only. Aliases
# that replace a standard command (cat, ls, grep, tree): agents write flags for
# the standard command, and `grep -r` means --replace in rg. The Socket Firewall
# aliases (npm, pnpm, ...): sfw adds about 0.4 s and a node process to each
# call. Agents keep the release-age delays of mise, Bun, and pnpm.
[shell_alias]
g = "git"
gcai = "commit-ai"
ll = "eza -la --git"
la = "eza -a"
lg = "lazygit"
n = "nvim"
cc = "claude"
help = "use-my-mac"
myip = "curl ifconfig.me"
hosts = "sudo nvim /etc/hosts"
localip = "{% if os() == 'macos' %}ipconfig getifaddr en0{% else %}hostname -I | awk '{print $1}'{% endif %}"
cleanup = "find . -name .DS_Store -delete"
brewup = "brew update && brew upgrade && brew cleanup"

# mise installs the precompiled Ruby, and compiles only when there is none.
[settings.ruby]
# For a compile: configure otherwise runs the first `ruby` on PATH. The mise
# shim then waits for the Ruby that is being built, and the install hangs.
# Docs add build time.
ruby_build_opts = "--without-baseruby --disable-install-doc"


[settings.github]
credential_command = '"$HOME/bin/dotfiles-gh-real" auth token --hostname "$MISE_CREDENTIAL_HOST"'
use_git_credentials = true

[settings.self_update]
auto = true
# mise updates itself to each new release at once. minimum_release_age applies
# to the tools only.
minimum_release_age = "0s"

[settings.task]
run_auto_install = false
# Task arguments use the usage field. mise makes this the default in 2027.5.0.
disable_spec_from_run_scripts = true

# The checkout's path for the tasks below. ~/.config/mise links to this folder
# in the checkout, so the link gives the path on every machine.
[vars]
dotfiles_root = '${DOTFILES_ROOT:-$(cd -P "$HOME/.config/mise" && cd ../../.. && pwd)}'

# Shortcuts for the dotfiles scripts. They work from any folder, for example
# `mise run dot:status` or `mise run dot:setup --dry-run`. Each name starts
# with dot:, because a project task with the same name replaces a global task.
# raw_args sends every argument, --help too, to the script.
[tasks."dot:status"]
description = "Show which managed files are missing or differ"
run = '"{{vars.dotfiles_root}}/bin/link-dotfiles" --status'
raw_args = true

[tasks."dot:diff"]
description = "Show the changes that dot:apply would make"
run = '"{{vars.dotfiles_root}}/bin/link-dotfiles" --diff'
raw_args = true

[tasks."dot:apply"]
description = "Apply managed files, with backups"
run = '"{{vars.dotfiles_root}}/bin/link-dotfiles"'
raw_args = true
raw = true

[tasks."dot:save"]
description = "Save agent settings into the repository, without private keys"
run = '"{{vars.dotfiles_root}}/bin/save-settings"'
raw_args = true

[tasks."dot:drift"]
description = "Report installed apps and tools that differ from the Brewfiles and mise lists"
run = '"{{vars.dotfiles_root}}/bin/prepare-sync"'
raw_args = true

[tasks."dot:setup"]
description = "Run setup"
run = '"{{vars.dotfiles_root}}/bin/setup"'
raw_args = true
raw = true

[tasks."dot:update"]
description = "Pull the repository and run the setup continuation"
run = '"{{vars.dotfiles_root}}/bin/dotfiles-update"'
raw_args = true
raw = true

[tasks."dot:packages"]
description = "Install the apps in apps/manifest.tsv"
run = '"{{vars.dotfiles_root}}/bin/install-apps"'
raw_args = true
raw = true

[tasks."dot:backup"]
description = "Back up portable app state"
run = '"{{vars.dotfiles_root}}/bin/file-backup"'
raw_args = true
raw = true

[tasks."dot:restore"]
description = "Restore portable app state"
run = '"{{vars.dotfiles_root}}/bin/file-restore"'
raw_args = true
raw = true

[tasks."dot:doctor"]
description = "Check the repository and setup prerequisites"
run = '"{{vars.dotfiles_root}}/bin/preflight"'
raw_args = true

# Local history of the settings files that bin/link-dotfiles merges into. The
# history stays in ~/.local/state/mise/history-local and holds the private
# keys too, so it never leaves this machine. bin/link-dotfiles saves a
# checkpoint before and after each merge. Browse it with
# `mise dot history --path <file>`, and restore with `mise dot rollback <file>`.
[dotfiles]
"~/.claude/settings.json" = { mode = "track-local" }
"~/.codex/config.toml" = { mode = "track-local" }
"~/.t3/userdata/settings.json" = { mode = "track-local" }
"~/.config/opencode/opencode.json" = { mode = "track-local" }
"~/.pi/agent/settings.json" = { mode = "track-local" }
"~/.config/pnpm/config.yaml" = { mode = "track-local" }
