# An older mise cannot parse self_update.minimum_release_age. With this floor it
# stops with an upgrade message. Run ./bin/install-standalone mise to install the pin.
min_version = "2026.11.1"

[tools]
# Tools for one profile only are in config.<profile>.toml in this folder.
# Mac and Linux. pnpm stays before node, so Corepack wrappers do not shadow it.
pnpm = "latest"
npm = "12.2.1"
node = "26.12.1"
rust = "latest"
# Security exception to the four-day delay: 1.26.1 updates gix and
# rustls-webpki for GHSA-q54r-jf2p-rfr2 and CVE-2026-111943.
cargo-binstall = "1.26.1"
sccache = "latest"
direnv = "latest"
bun = "1.4.4"
# Security exception to the four-day delay: 3.8.1 fixes CVE-2026-105802,
# CVE-2026-105803, CVE-2026-69260, and CVE-2026-69261.
git-lfs = "3.8.1"
uv = "0.13.5"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
lazygit = "latest"
tmux = "latest"
jq = "latest"
gh = "2.103.3"
bat = "latest"
eza = "0.23.5"
zoxide = "latest"
neovim = "latest"
"npm:sfw" = "latest"
"npm:tree-sitter-cli" = "latest"
# Security exception to the four-day delay: 3.15.2 fixes CVE-2026-115557
# and CVE-2026-114583.
python = "3.15.2"
ruby = "3.4.12"
age = "latest"
"github:entireio/cli" = "latest"
ast-grep = "latest"
yq = "latest"
cloudflared = "2026.10.2"
cmake = "latest"
redis = "latest"
worktrunk = "latest"
yamlfmt = "latest"
"npm:ctx7" = "latest"
"npm:eas-cli" = "latest"
# Drives iOS simulators and Android devices for the agents and the T3 device hub.
"npm:agent-device" = "latest"
"pipx:httpie" = { version = "latest", python = "3.15", with = ["certifi==2026.10.19"] }
"github:boyter/scc" = "latest"
"conda:aria2" = "latest"
"conda:sox" = "latest"
"conda:tig" = "latest"
"conda:tree" = "latest"
"npm:cf" = "latest"
# Needs node 22.15 or later. bin/setup-tokenburnmarket signs in and installs
# the sync daemon, and refreshes it after `mise up` moves node or this tool.
"npm:tokenburnmarket" = "latest"
# Security exception to the four-day delay: 4.153.0 includes Undici 7.30.1
# for CVE-2026-109383, CVE-2026-109932, and CVE-2026-87018.
wrangler = { version = "4.153.0", allow_builds = ["esbuild", "sharp", "workerd"] }
# Git hooks for repos with an hk.pkl, including this one.
hk = "latest"
# Formats Markdown in repos whose hk.pkl runs it, including this one.
"npm:oxfmt" = "latest"
shellcheck = "latest"
shfmt = "latest"
# TypeScript checks and the editor language server (~/.config/tsrs/tsgo).
"npm:tsrs" = "latest"
# Linux only: the Mac installs btop with Homebrew, and btop ships no macOS build.
btop = { version = "latest", os = "linux" }

# Every Mac. Add a tool to the list above when a Linux box needs it. A tool
# for one Mac only goes in config.<profile>.toml.
perl = { version = "5.44.0", os = "macos" }
ccache = { version = "latest", os = "macos" }
cocoapods = { version = "latest", os = "macos" }
coreutils = { version = "latest", os = "macos" }
fastfetch = { version = "latest", os = "macos" }
xcodes = { version = "latest", os = "macos" }
awscli = { version = "2.38.4", os = "macos" }
gcloud = { version = "589.0.0", os = "macos" }
mkcert = { version = "latest", os = "macos" }
hub = { version = "latest", os = "macos" }
# Security exception to the four-day delay: 0.2.97 fixes
# GHSA-5xfg-9629-mqgg, GHSA-jpm2-x6wf-fxjc, GHSA-74m9-q5m3-x53f,
# GHSA-9xfw-6wqp-rq8f, and GHSA-9j7q-g3ch-2283.
act = { version = "0.2.97", os = "macos" }
pandoc = { version = "latest", os = "macos" }
typst = { version = "latest", os = "macos" }
imagemagick = { version = "latest", os = "macos" }
infisical = { version = "0.44.6", os = "macos" }
portless = { version = "latest", os = "macos" }
vercel = { version = "latest", os = "macos" }
turbo = { version = "latest", os = "macos" }
mas = { version = "latest", os = "macos" }
"npm:agent-browser" = { version = "latest", os = "macos" }
"npm:agent-desktop" = { version = "latest", os = "macos" }
"npm:@yaakapp/cli" = { version = "latest", os = "macos" }
"github:ryanoasis/nerd-fonts" = { version = "latest", asset_pattern = "Hack.zip", os = "macos" }
"github:coollabsio/coolify-cli" = { version = "latest", os = "macos" }
"gem:fastlane" = { version = "2.241.1", install_env = { GEMRC = "{{ config_source | dirname }}/gemrc" }, os = "macos" }
"npm:ios-deploy" = { version = "latest", os = "macos" }
"github:OpenVPN/easy-rsa" = { version = "latest", os = "macos" }
"pipx:tldr" = { version = "latest", os = "macos" }
"conda:bfg" = { version = "latest", os = "macos" }
"conda:wget" = { version = "latest", os = "macos" }
herdr = { version = "latest", os = "macos" }
"github:flowcopilot/aether" = { version = "0.2.9", os = "macos" }
xcodegen = { version = "latest", os = "macos" }
"npm:oh-my-t3" = "latest"

[settings]
experimental = true
# Activated shells (configs/zsh/mise-activate.zsh) never install a missing tool
# when a command is not found. Setup and `mise install` install tools.
not_found_auto_install = false
# The repository root holds a mise.toml. Trust it, so tools work in that folder.
# Work and client projects are trusted too. ~/code/contrib and ~/code/ref hold
# other people's repositories, so mise asks before it loads a config there.
trusted_config_paths = ["~/code/personal/dotfiles", "~/code/work", "~/code/client"]
# Linux boxes install from the same lockfile.
lockfile_platforms = ["macos-arm64", "linux-x64"]
use_versions_host_track = false
# Codex CLI is vendor-owned. Ignore old project or shell version requests too.
disable_tools = ["codex", "aqua:openai/codex", "npm:@openai/codex"]
minimum_release_age = "4d"
# Entries match a full backend ID, a registry short name, or a backend wildcard.
# bun installs the npm: tools and has its own delay. Add each npm: entry to
# minimumReleaseAgeExcludes in configs/bun/bunfig.toml too.
minimum_release_age_excludes = [
  "npm:cf",
  "npm:eas-cli",
  "npm:agent-browser",
  "npm:agent-desktop",
  "npm:agent-device",
  "npm:tokenburnmarket",
  "npm:oh-my-t3",
  "npm:omt3",
  "npm:t3",
  "github:flowcopilot/aether",
  # Code checks run the newest release, so a project and the editor agree.
  "npm:oxlint",
  "npm:oxfmt",
  "npm:tsrs",
  "npm:tla-ts",
  "npm:fallow",
  "npm:react-doctor",
  "hk",
]

[settings.npm]
package_manager = "bun"

# Activated shells define these aliases, in zsh and bash, for people and agents.
# configs/zsh/aliases.zsh keeps two groups for interactive zsh only. Aliases
# that replace a standard command (cat, ls, grep, tree): agents write flags for
# the standard command, and `grep -r` means --replace in rg. The Socket Firewall
# aliases (npm, pnpm, ...): sfw adds about 0.4 s and a node process to each
# call. Agents keep the release-age delays of mise, Bun, and pnpm.
[shell_alias]
g = "git"
gcai = "commit-ai"
ll = "eza -la --git"
la = "eza -a"
lg = "lazygit"
n = "nvim"
cc = "claude"
help = "use-my-mac"
myip = "curl ifconfig.me"
hosts = "sudo nvim /etc/hosts"
localip = "{% if os() == 'macos' %}ipconfig getifaddr en0{% else %}hostname -I | awk '{print $1}'{% endif %}"
cleanup = "find . -name .DS_Store -delete"
brewup = "brew update && brew upgrade && brew cleanup"

# Compilation was enabled because precompiled Ruby 3.4.11 bundled OpenSSL 3.5.5.
[settings.ruby]
compile = true
# configure otherwise runs the first `ruby` on PATH. The mise shim then waits
# for the Ruby that is being built, and the install hangs. Docs add build time.
ruby_build_opts = "--without-baseruby --disable-install-doc"

[settings.cargo]
binstall = true

[settings.github]
credential_command = '"$HOME/bin/dotfiles-gh-real" auth token --hostname "$MISE_CREDENTIAL_HOST"'
use_git_credentials = true

[settings.self_update]
auto = true
# mise updates itself to each new release at once. minimum_release_age applies
# to the tools only.
minimum_release_age = "0s"

[settings.task]
run_auto_install = false

# The checkout's path for the tasks below. ~/.config/mise links to this folder
# in the checkout, so the link gives the path on every machine.
[vars]
dotfiles_root = '${DOTFILES_ROOT:-$(cd -P "$HOME/.config/mise" && cd ../../.. && pwd)}'

# Shortcuts for the dotfiles scripts. They work from any folder, for example
# `mise run dot:status` or `mise run setup -- --dry-run`.
[tasks."dot:status"]
description = "Show which managed files are missing or differ"
run = '"{{vars.dotfiles_root}}/bin/link-dotfiles" --status'

[tasks."dot:diff"]
description = "Show the changes that dot:apply would make"
run = '"{{vars.dotfiles_root}}/bin/link-dotfiles" --diff'

[tasks."dot:apply"]
description = "Apply managed files, with backups"
run = '"{{vars.dotfiles_root}}/bin/link-dotfiles"'
raw = true

[tasks."dot:save"]
description = "Save agent settings into the repository, without private keys"
run = '"{{vars.dotfiles_root}}/bin/save-settings"'

[tasks."dot:drift"]
description = "Report installed apps and tools that differ from the Brewfiles and mise lists"
run = '"{{vars.dotfiles_root}}/bin/prepare-sync"'

[tasks.setup]
description = "Run setup"
run = '"{{vars.dotfiles_root}}/bin/setup"'
raw = true

[tasks.update]
description = "Pull the repository and run the setup continuation"
run = '"{{vars.dotfiles_root}}/bin/dotfiles-update"'
raw = true

[tasks.packages]
description = "Install the apps in apps/manifest.tsv"
run = '"{{vars.dotfiles_root}}/bin/install-apps"'
raw = true

[tasks.backup]
description = "Back up portable app state"
run = '"{{vars.dotfiles_root}}/bin/file-backup"'
raw = true

[tasks.restore]
description = "Restore portable app state"
run = '"{{vars.dotfiles_root}}/bin/file-restore"'
raw = true

[tasks.doctor]
description = "Check the repository and setup prerequisites"
run = '"{{vars.dotfiles_root}}/bin/preflight"'
