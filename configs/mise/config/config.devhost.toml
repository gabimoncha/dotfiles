# Runtime tools for the development machines: every role except lightshell.
# dotfiles_profile_mise_env in bin/lib/dotfiles-profile.sh adds the devhost
# environment before the role, so mise loads this file after config.toml
# and locks its tools in mise.devhost.lock. The settings in config.toml apply
# here too.

[tools]
# Mac and Linux.
rust = "latest"
# Security exception to the four-day delay: 1.27.0 updates zstd-safe for
# RUSTSEC-2026-0395 through RUSTSEC-2026-0406 and rustix for RUSTSEC-2026-0486.
cargo-binstall = "1.27.0"
sccache = "latest"
direnv = "latest"
bun = "1.4.5"
uv = "0.13.7"
# Security exception to the four-day delay: 3.15.2 fixes CVE-2026-115557
# and CVE-2026-114583.
python = "3.15.2"
cloudflared = "2026.10.2"
# Each cmake release is a 93 MB download on macOS. The minor-version pin
# keeps `mise up` in 4.5, and you raise it when you need a new minor version.
cmake = "4.5"
redis = "latest"
worktrunk = "latest"
yamlfmt = "latest"
"npm:ctx7" = "latest"
# Installs and updates the agent skills in configs/agents/skills.
"npm:skills" = "latest"
"pipx:httpie" = { version = "latest", python = "3.15", with = ["certifi==2026.10.19"] }
"github:boyter/scc" = "latest"
"github:flowcopilot/aether" = "latest"
# Reads the fleet secrets from Infisical. The repository also releases its
# plugins, and one of them is often the GitHub "Latest" release, so read only
# the CLI tags.
"github:dmno-dev/varlock" = { version = "latest", version_prefix = "varlock@" }
"conda:aria2" = "latest"
"conda:sox" = "latest"
"conda:tig" = "latest"
"conda:tree" = "latest"
"npm:cf" = "latest"
# Needs node 22.15 or later. bin/setup-tokenburnmarket signs in and installs
# the sync daemon, and refreshes it after `mise up` moves node or this tool.
"npm:tokenburnmarket" = "latest"
# Security exception to the four-day delay: 4.153.0 includes Undici 7.30.1
# for CVE-2026-109383, CVE-2026-109932, and CVE-2026-87018.
wrangler = { version = "4.153.0", allow_builds = ["esbuild", "sharp", "workerd"] }
shellcheck = "latest"
shfmt = "latest"
# Linux only: the Mac installs btop with Homebrew, and btop ships no macOS build.
btop = { version = "latest", os = "linux" }
# Linux only: the supervisor of the [daemons] in mise.container.toml. The Macs
# run their services with launchd.
pitchfork = { version = "latest", os = "linux" }
# The JDK for Android builds and sdkmanager. mise sets JAVA_HOME in activated
# shells. Scripts and configs/zsh/env.zsh use the link that follows upgrades:
# ~/.local/share/mise/installs/java/global.
java = "zulu-17"

# Every development Mac. Add a tool to the list above when a Linux box needs
# it. A tool for one role only goes in config.<role>.toml.
perl = { version = "5.44.0", os = "macos" }
ccache = { version = "latest", os = "macos" }
cocoapods = { version = "latest", os = "macos" }
# 0.13.0 has no macOS assets: https://github.com/uutils/coreutils/issues/16744.
# Go back to "latest" when a release has them.
coreutils = { version = "0.12.0", os = "macos" }
xcodes = { version = "latest", os = "macos" }
awscli = { version = "2.38.4", os = "macos" }
gcloud = { version = "589.0.0", os = "macos" }
mkcert = { version = "latest", os = "macos" }
hub = { version = "latest", os = "macos" }
act = { version = "0.2.98", os = "macos" }
pandoc = { version = "latest", os = "macos" }
typst = { version = "latest", os = "macos" }
imagemagick = { version = "latest", os = "macos" }
infisical = { version = "0.45.8", os = "macos" }
portless = { version = "latest", os = "macos" }
vercel = { version = "latest", os = "macos" }
"npm:agent-desktop" = { version = "latest", os = "macos" }
"npm:@yaakapp/cli" = { version = "latest", os = "macos" }
"github:ryanoasis/nerd-fonts" = { version = "latest", asset_pattern = "Hack.zip", os = "macos" }
"github:coollabsio/coolify-cli" = { version = "latest", os = "macos" }
"gem:fastlane" = { version = "2.241.2", install_env = { GEMRC = "{{ config_source | dirname }}/gemrc" }, os = "macos" }
"npm:ios-deploy" = { version = "latest", os = "macos" }
"github:OpenVPN/easy-rsa" = { version = "latest", os = "macos" }
"pipx:tldr" = { version = "latest", os = "macos" }
"conda:bfg" = { version = "latest", os = "macos" }
# ffmpeg and yt-dlp stay in the Brewfile: other apps look for them in
# /opt/homebrew/bin.
exiftool = { version = "latest", os = "macos" }
minisign = { version = "latest", os = "macos" }
poppler = { version = "latest", os = "macos" }
xcodegen = { version = "latest", os = "macos" }
"npm:oh-my-t3" = "0.8.1"
