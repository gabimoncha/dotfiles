# Runtime tools for the mainhost role only. miserc.local.toml selects the
# role, so mise loads this file and locks its tools in mise.mainhost.lock.
# The settings in config.toml apply here too.

[tools]
ollama = "0.40.8"
"github:CoastalFuturist/bodhi" = "latest"
"github:CoastalFuturist/ytcli" = "latest"
# The Mackup backup stores its files in Synology Drive.
"pipx:mackup" = "latest"
