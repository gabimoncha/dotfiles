# Runtime tools for the macowl profile only. miserc.local.toml selects the
# profile, so mise loads this file and locks its tools in mise.macowl.lock.
# The settings in config.toml apply here too.

[tools]
"npm:agent-device" = "latest"
ollama = "0.40.8"
"github:CoastalFuturist/bodhi" = "latest"
"github:CoastalFuturist/ytcli" = "latest"
# The Mackup backup stores its files in Synology Drive.
"pipx:mackup" = "latest"
