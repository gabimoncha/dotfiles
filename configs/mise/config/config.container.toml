# Runtime tools for the container profile (nasbox) only. miserc.local.toml
# selects the profile, so mise loads this file and locks its tools in
# mise.container.lock. The settings in config.toml apply here too.

[tools]
"npm:agent-device" = "latest"
# Leases simulators, emulators and USB phones to parallel agents. T3 Code
# connects to it as a Simlock device host.
"npm:simlock" = "latest"
