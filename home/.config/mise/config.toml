# An older mise cannot parse [settings.self_update]. With this floor it stops
# with an upgrade message. Run ./bin/ensure-mise-standalone to install the pin.
min_version = "2026.10.4"

[tools]
pnpm = "latest"
node = "24.22.1"
perl = "5.42.0"
python = "3.14.8"
ruby = "3.4.11"
rust = "latest"
cargo-binstall = "1.20.0"
ccache = "latest"
age = "latest"
cocoapods = "latest"
coreutils = "latest"
direnv = "latest"
bun = "1.4.3"
git-lfs = "latest"
uv = "0.13.4"
fastfetch = "latest"
xcodes = "latest"
"github:entireio/cli" = "latest"
fzf = "latest"
ast-grep = "latest"
ripgrep = "latest"
fd = "latest"
lazygit = "latest"
tmux = "latest"
yq = "latest"
jq = "latest"
awscli = "2.35.18"
gh = "2.100.0"
gcloud = "589.0.0"
flyctl = "0.4.117"
cloudflared = "latest"
mkcert = "latest"
hub = "latest"
act = "latest"
cmake = "latest"
ollama = "0.40.2"
redis = "latest"
bat = "latest"
eza = "0.23.4"
zoxide = "latest"
pandoc = "latest"
typst = "latest"
yamlfmt = "latest"
neovim = "latest"
docker-cli = "latest"
docker-compose = "latest"
imagemagick = "latest"
infisical = "0.43.104"
portless = "latest"
vercel = "latest"
turbo = "latest"
worktrunk = "latest"
mas = "latest"
"npm:ctx7" = "latest"
"npm:eas-cli" = "latest"
"npm:agent-device" = "latest"
"npm:agent-browser" = "latest"
"npm:repomix" = "latest"
"npm:sfw" = "latest"
"npm:@yaakapp/cli" = "latest"
"npm:tree-sitter-cli" = "latest"
"github:ryanoasis/nerd-fonts" = { version = "latest", asset_pattern = "Hack.zip" }
"github:coollabsio/coolify-cli" = "latest"
"github:CoastalFuturist/bodhi" = "latest"
"github:CoastalFuturist/ytcli" = "latest"
"gem:fastlane" = "2.237.0"
"pipx:httpie" = { version = "latest", with = ["certifi==2026.10.19"] }
"pipx:mackup" = "latest"
"npm:ios-deploy" = "latest"
"github:boyter/scc" = "latest"
"github:OpenVPN/easy-rsa" = "latest"
"pipx:tldr" = "latest"
"conda:aria2" = "latest"
"conda:bfg" = "latest"
"conda:sox" = "latest"
"conda:tig" = "latest"
"conda:tree" = "latest"
"conda:wget" = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
"npm:cf" = "latest"
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
herdr = "latest"
hunk = "latest"
"github:flowcopilot/aether" = "0.2.6"
xcodegen = "latest"

[settings]
experimental = true
use_versions_host_track = false
# Codex CLI is vendor-owned. Ignore old project or shell version requests too.
# This does not disable codex-acp or its private npm dependency.
disable_tools = ["codex", "aqua:openai/codex", "npm:@openai/codex"]
minimum_release_age = "4d"
# Entries match a full backend ID, a registry short name, or a backend wildcard.
minimum_release_age_excludes = ["npm:agent-browser", "npm:agent-device", "npm:eas-cli", "npm:@agentclientprotocol/codex-acp", "npm:@agentclientprotocol/claude-agent-acp", "npm:cf", "github:flowcopilot/aether"]

[settings.npm]
package_manager = "bun"

# The precompiled Ruby 3.4.11 still bundles OpenSSL 3.5.5.
[settings.ruby]
compile = true

[settings.cargo]
binstall = true

[settings.github]
credential_command = '"$HOME/bin/dotfiles-gh-real" auth token --hostname "$MISE_CREDENTIAL_HOST"'
use_git_credentials = true

[settings.self_update]
auto = true

# Update vendor-owned agents after direct mise installation/upgrade commands.
# The interactive shell helper covers no-op upgrades and prevents duplicate runs.
[hooks]
postinstall = 'if [ "${DOTFILES_HARNESS_SKIP_HOOK:-0}" != 1 ] && [ -x "$HOME/bin/harness" ]; then "$HOME/bin/harness" update --installed-only; fi'
