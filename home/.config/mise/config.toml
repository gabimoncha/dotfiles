[settings]
experimental = true
# Linux boxes install from the same lockfile.
lockfile_platforms = ["macos-arm64", "linux-x64"]
use_versions_host_track = false
# Codex CLI is vendor-owned. Ignore old project or shell version requests too.
# This does not disable codex-acp or its private npm dependency.
disable_tools = ["codex", "aqua:openai/codex", "npm:@openai/codex"]
minimum_release_age = "4d"
# Entries match a full backend ID, a registry short name, or a backend wildcard.
minimum_release_age_excludes = ["npm:agent-browser", "npm:agent-device", "npm:eas-cli", "npm:@agentclientprotocol/codex-acp", "npm:@agentclientprotocol/claude-agent-acp", "npm:cf", "github:flowcopilot/aether"]

[settings.npm]
package_manager = "bun"

# The precompiled Ruby 3.4.11 still bundles OpenSSL 3.5.5.
[settings.ruby]
compile = true
# configure otherwise runs the first `ruby` on PATH. The mise shim then waits
# for the Ruby that is being built, and the install hangs. Docs add build time.
ruby_build_opts = "--without-baseruby --disable-install-doc"

[settings.cargo]
binstall = true

[settings.github]
credential_command = '"$HOME/bin/dotfiles-gh-real" auth token --hostname "$MISE_CREDENTIAL_HOST"'
use_git_credentials = true

[settings.self_update]
auto = true

# After a direct mise install or upgrade: forget configs whose files are gone,
# delete the tool versions that no tracked config selects, then update the
# vendor-owned agents. The prune runs at once. mise's own upgrade prune waits
# 24 hours and skips pin changes. The interactive shell helper covers no-op
# upgrades and prevents duplicate runs.
[hooks]
postinstall = 'if [ "${DOTFILES_HARNESS_SKIP_HOOK:-0}" != 1 ]; then "${MISE_INSTALL_PATH:-$HOME/.local/bin/mise}" prune --yes --quiet || echo "mise prune failed; rerun: mise prune" >&2; [ ! -x "$HOME/bin/harness" ] || "$HOME/bin/harness" update --installed-only; fi'
