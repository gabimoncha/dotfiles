# ── Plugins ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ── Theme ────────────────────────────────────────────────
# Osaka Jade palette, matching the tracked Ghostty theme.
set -g @catppuccin_flavor 'mocha'
set -g @thm_bg '#111c18'
set -g @thm_fg '#C1C497'
set -g @thm_rosewater '#F6F5DD'
set -g @thm_flamingo '#db9f9c'
set -g @thm_pink '#D2689C'
set -g @thm_mauve '#D2689C'
set -g @thm_red '#FF5345'
set -g @thm_maroon '#db9f9c'
set -g @thm_peach '#D7C995'
set -g @thm_yellow '#E5C736'
set -g @thm_green '#549e6a'
set -g @thm_teal '#2DD5B7'
set -g @thm_sky '#8CD3CB'
set -g @thm_sapphire '#75bbb3'
set -g @thm_blue '#509475'
set -g @thm_lavender '#ACD4CF'
set -g @thm_subtext_1 '#C1C497'
set -g @thm_subtext_0 '#ACD4CF'
set -g @thm_overlay_2 '#53685B'
set -g @thm_overlay_1 '#53685B'
set -g @thm_overlay_0 '#53685B'
set -g @thm_surface_2 '#53685B'
set -g @thm_surface_1 '#23372B'
set -g @thm_surface_0 '#23372B'
set -g @thm_mantle '#111c18'
set -g @thm_crust '#111c18'

set -g @catppuccin_status_background '#111c18'
set -g @catppuccin_window_text_color '#23372B'
set -g @catppuccin_window_number_color '#53685B'
set -g @catppuccin_window_current_text_color '#23372B'
set -g @catppuccin_window_current_number_color '#2DD5B7'
set -g @catppuccin_application_color '#D2689C'
set -g @catppuccin_session_color '#{?client_prefix,#FF5345,#549e6a}'
set -g @catppuccin_cpu_color '#E5C736'
set -g @catppuccin_uptime_color '#75bbb3'
set -g @catppuccin_battery_color '#549e6a'
set -g @catppuccin_status_application_icon_fg '#111c18'
set -g @catppuccin_status_application_icon_bg '#D2689C'
set -g @catppuccin_status_application_text_fg '#C1C497'
set -g @catppuccin_status_session_icon_fg '#111c18'
set -g @catppuccin_status_session_icon_bg '#{?client_prefix,#FF5345,#549e6a}'
set -g @catppuccin_status_session_text_fg '#C1C497'
set -g @catppuccin_status_cpu_icon_fg '#111c18'
set -g @catppuccin_status_cpu_icon_bg '#E5C736'
set -g @catppuccin_status_uptime_icon_fg '#111c18'
set -g @catppuccin_status_uptime_icon_bg '#75bbb3'
set -g @catppuccin_status_uptime_text_fg '#C1C497'
set -g @catppuccin_status_battery_icon_fg '#111c18'
set -g @catppuccin_status_battery_icon_bg '#549e6a'
set -g @catppuccin_status_battery_text_fg '#C1C497'

# Shared fzf colors for the session and window switchers.
set-environment -g FZF_OSAKA_JADE_COLORS '--color=dark,fg:#C1C497,bg:#111c18,hl:#E5C736,fg+:#F6F5DD,bg+:#23372B,hl+:#2DD5B7,info:#53685B,prompt:#2DD5B7,pointer:#FF5345,marker:#549e6a,spinner:#2DD5B7,header:#509475,border:#53685B,preview-border:#53685B,preview-scrollbar:#53685B,query:#F6F5DD,gutter:#111c18'

# Window status style
set -g @catppuccin_window_status_enable "yes"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

# Show window name AND running program
set -g @catppuccin_window_current_text " #W | #{pane_current_command}"
set -g @catppuccin_window_text " #W | #{pane_current_command}"

# ── Status Bar ───────────────────────────────────────────
set -g status 2
set -g status-position bottom
set -g message-line 0
set -g status-interval 1
set -g status-left-length 200
set -g status-right-length 200

# ── Basic Settings ───────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set-option -g allow-rename off

# Prefix: Ctrl-Space
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Bindings ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind H split-window -h -c "#{pane_current_path}"
bind V split-window -v -c "#{pane_current_path}"

# Pane navigation handled by vim-tmux-navigator plugin


unbind '"'
unbind %

# Session switcher
bind S display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse \"\$FZF_OSAKA_JADE_COLORS\" --preview-border=rounded --header jump-to-session --preview 'tmux capture-pane -pt {}' |\
    xargs tmux switch-client -t"

# Window switcher
bind s display-popup -E "\
    tmux list-windows -a -F '#S:#W' |\
    sed '/^$/d' |\
    fzf --reverse \"\$FZF_OSAKA_JADE_COLORS\" --preview-border=rounded --header jump-to-window --preview 'tmux capture-pane -pt {}' |\
    xargs tmux switch-client -t"

# New session and new window, or switch to existin session
bind N command-prompt -p "Session name" {
  if-shell "tmux has-session -t '=%%' 2>/dev/null" {
    switch-client -t "=%%"
  } {
    command-prompt -p "First window name" {
      new-session -d -c "#{pane_current_path}" -s "%1" -n "%%"
      switch-client -t "=%1"
    }
  }
}

# New window in current session
bind W command-prompt -p "Window name" {
  if-shell "tmux list-windows -F '#{window_name}' | grep -Fxq -- '%%'" {
    select-window -t "%%"
  } {
    new-window -c "#{pane_current_path}" -n "%%"
  }
}

# ── Continuum ────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ── Initialize TPM ───────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# Compose status modules after their plugins have initialized. CPU and battery
# need this eager expansion pass so their plugin formats render as live values.
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#{E:@catppuccin_status_application}"
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right '#[bg=#{@thm_surface_0},fg=#{@thm_fg}] %H:%M %d/%b/%y'

# CPU and battery plugins interpolate their placeholders into status-right.
# Re-run that interpolation after assembling the custom themed bar.
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'

# Keep the themed bar on the bottom row and reserve the row above it for
# visual spacing and command prompts. Only move the format once so reloads
# remain idempotent.
%if "#{!=:#{status-format[0]},}"
set -gF status-format[1] "#{status-format[0]}"
set -g status-format[0] ""
%endif
