# macOS only. mise loads this file on every Mac. macos/defaults.sh applies the
# [bootstrap.settings.macos] preferences, Dock apps, and login items of this
# file and of the profile file, then sets input sources and display sleep,
# which mise cannot set.

[dotfiles]
"~/Library/Application Support/com.mitchellh.ghostty/config" = { source = "configs/ghostty/config", mode = "symlink" }
# The login script that gives GUI apps the telemetry opt-outs.
"~/bin/dotfiles-telemetry-env" = { source = "macos/dotfiles-telemetry-env", mode = "symlink" }
# The script of the process-log login job below.
"~/bin/dotfiles-process-log" = { source = "bin/log-processes", mode = "symlink" }

# The login job runs that script. mise expands ~/ in program when it writes the
# plist. bin/configure-telemetry applies it.
[bootstrap.macos.launchd.agents.telemetry-env]
program = "~/bin/dotfiles-telemetry-env"
run_at_load = true

# Each minute, log free memory and the busiest processes into
# ~/.local/state/dotfiles/process-log/. A later memory incident then shows what
# grew and which parent started it. bin/configure-telemetry applies it.
[bootstrap.macos.launchd.agents.process-log]
program = "~/bin/dotfiles-process-log"
run_at_load = true
start_interval = 60
process_type = "Background"

[bootstrap.settings.macos.defaults.NSGlobalDomain]
AppleLocale = "en_US@currency=RON"
AppleKeyboardUIMode = 3
# Language & Region > Live Text. Off, so a paused video in Safari does not turn
# into selectable text.
AppleLiveTextEnabled = false
ApplePressAndHoldEnabled = false
InitialKeyRepeat = 15
KeyRepeat = 2
NSAutomaticCapitalizationEnabled = false
NSAutomaticDashSubstitutionEnabled = true
NSAutomaticQuoteSubstitutionEnabled = true
NSAutomaticSpellingCorrectionEnabled = false
KB_SpellingLanguage = { KB_SpellingLanguageIsAutomatic = true }
NSSpellCheckerAutomaticallyIdentifiesLanguages = true
"com.apple.keyboard.fnState" = false
"com.apple.mouse.scaling" = 3.0
"com.apple.scrollwheel.scaling" = 1.7
"com.apple.swipescrolldirection" = true
"com.apple.trackpad.forceClick" = false
"com.apple.trackpad.scaling" = 3.0

[bootstrap.settings.macos.defaults."com.apple.AppleMultitouchMouse"]
MouseButtonMode = "OneButton"
MouseHorizontalScroll = true
MouseMomentumScroll = true
MouseOneFingerDoubleTapGesture = 1
MouseTwoFingerHorizSwipeGesture = 2

[bootstrap.settings.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
Dragging = false
TrackpadRightClick = true
TrackpadThreeFingerDrag = false

[bootstrap.settings.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadRightClick = true
TrackpadThreeFingerDrag = false

[bootstrap.settings.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXPreferredViewStyle = "Nlsv"
ShowPathbar = true
ShowStatusBar = true

[bootstrap.settings.macos.defaults."com.apple.screencapture"]
"disable-shadow" = true

# The apps that open at login on every Mac. mise.devhost.toml and the profile
# file add their own apps.
# mise adds the missing ones and leaves other login items alone.
[bootstrap.settings.macos.login_items]
apps = ["/Applications/Ghostty.app", "/Applications/Raycast.app", "/Applications/Tailscale.app"]

# The apps pinned in the Dock, in this order. mise adds, removes, and orders
# them. Folders and files in the Dock stay as they are.
[bootstrap.settings.macos.dock]
apps = [
  "/System/Applications/Apps.app",
  "/Applications/Safari.app",
  "/System/Applications/Photos.app",
  "/System/Applications/FaceTime.app",
  "/System/Applications/App Store.app",
  "/System/Applications/Siri AI.app",
  "/System/Applications/System Settings.app",
]

[bootstrap.settings.macos.defaults."com.apple.dock"]
autohide = true
largesize = 51
magnification = true
orientation = "bottom"
"expose-group-apps" = true
tilesize = 34

[bootstrap.settings.macos.defaults."com.apple.ActivityMonitor"]
SortDirection = 1

[bootstrap.settings.macos.defaults."com.apple.SoftwareUpdate"]
AutomaticCheckEnabled = true
AutomaticDownload = true

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Battery"
host = "current"
value = 19

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

# Turn off the Spotlight shortcuts (Cmd-Space and Cmd-Option-Space) for Raycast.
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 1048576] } }

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 1572864] } }

# Turn off Windows > General > Minimize (Cmd-M).
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["233"]
value = { enabled = false, value = { type = "standard", parameters = [109, 46, 1048576] } }

# Turn off every shortcut in Windows > Arrange. Keep any custom key bindings.
# Arrange Left and Right
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["248", "enabled"]
value = false

# Arrange Right and Left
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["249", "enabled"]
value = false

# Arrange Top and Bottom
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["250", "enabled"]
value = false

# Arrange Bottom and Top
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["251", "enabled"]
value = false

# Arrange in Quarters
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["256", "enabled"]
value = false
