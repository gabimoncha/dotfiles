# Files and checkouts for every host, the MacBook Air too. Apply them with
# ./bin/link-dotfiles. mise also loads mise.macos.toml or mise.linux.toml for
# the platform, mise.devhost.toml on the development machines (every profile
# except air), and the profile file that the ignored .miserc.local.toml
# selects: mise.macowl.toml, mise.macmini.toml, mise.air.toml, or
# mise.container.toml.
# bin/repo-mise requires the pinned mise. A soft minimum only warns, so tools
# in this folder keep working while an older mise is installed.
min_version = { soft = "2026.11.8" }

[dotfiles]
"~/.zshenv" = { source = "configs/zsh/zshenv", mode = "symlink" }
"~/.zprofile" = { source = "configs/zsh/zprofile", mode = "symlink" }
"~/.zshrc" = { source = "configs/zsh/zshrc", mode = "symlink" }
"~/.p10k.zsh" = { source = "configs/zsh/p10k.zsh", mode = "symlink" }
# Each other file in configs/zsh gets its own link in ~/.config/zsh. mise
# removes the link of a file that is deleted from configs/zsh.
"~/.config/zsh" = { source = "configs/zsh", mode = "symlink-each", exclude = [
  "zshenv",
  "zprofile",
  "zshrc",
  "p10k.zsh",
] }
"~/.config/bash/mise-activate.bash" = { source = "configs/bash/mise-activate.bash", mode = "symlink" }
"~/.bash_profile" = { source = "configs/bash/bash_profile", mode = "symlink" }

"~/.gitconfig" = { source = "configs/git/gitconfig", mode = "symlink" }
"~/bin/gh" = { source = "configs/gh/gh", mode = "symlink" }
"~/bin/dotfiles-gh-real" = { source = "configs/gh/dotfiles-gh-real", mode = "symlink" }

"~/.tmux.conf" = { source = "configs/tmux/tmux.conf", mode = "symlink" }
"~/.rgrc" = { source = "configs/ripgrep/rgrc", mode = "symlink" }
"~/.config/pnpm/config.yaml/dotfiles" = { source = "configs/pnpm/config.yaml", merge = true, permissions = "0600" }
"~/.config/nvim" = { source = "configs/nvim", mode = "symlink" }

# The global mise config folder: runtime tools and settings, each profile's
# config.<profile>.toml, and their locks. Its miserc.local.toml links to this
# repository's .miserc.local.toml, so mise loads this machine's profile file.
"~/.config/mise" = { source = "configs/mise/config", mode = "symlink" }

"~/bin/harness" = { source = "configs/harness/harness", mode = "symlink" }
"~/bin/claude" = { source = "configs/claude/claude", mode = "symlink" }
"~/bin/npx" = { source = "configs/npx/npx", mode = "symlink" }
"~/bin/px" = { source = "configs/npx/npx", mode = "symlink" }
# These apps rewrite their settings. mise sets only the keys in the sources,
# and creates a missing file with mode 0600, because it can hold tokens.
"~/.claude/settings.json/dotfiles" = { source = "configs/claude/settings.json", merge = true, permissions = "0600" }
"~/.codex/config.toml/dotfiles" = { source = "configs/codex/config.toml", merge = true, permissions = "0600" }
# A "/defaults" entry sets a key only when the file has none, so a profile can
# override it. bin/save-settings never saves these sources.
"~/.codex/config.toml/defaults" = { source = "configs/codex/defaults.toml", merge = "missing", permissions = "0600" }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-fzf-history-search" = { url = "https://github.com/joshskidmore/zsh-fzf-history-search.git", depth = 1 }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm", depth = 1 }

# In an activated shell in this folder, a pull or checkout that changes the
# file entries prints a reminder. Edits in a worktree print nothing, because
# file changes apply only from the main checkout after a merge.
[[watch_files]]
patterns = ["mise.toml", "mise.*.toml"]
run = '[ -z "$MISE_WATCH_FILES_GIT_REWRITTEN" ] || echo "The file entries changed. Run ./bin/link-dotfiles --dry-run, then ./bin/link-dotfiles."'

# The repository checks from the Validation section of AGENTS.md:
# ./bin/repo-mise run check. preflight also checks the shell syntax.
# `./bin/repo-mise run --output summary check` prints one line when the checks
# pass. `./bin/repo-mise tasks log check` prints the output of the last run.
[settings.task]
logs = true

[tasks.check]
description = "Run the repository checks"
run = [
  "git diff --check",
  "./bin/repo-mise --global tasks validate --errors-only",
  "./bin/repo-mise tasks validate --errors-only",
  "./bin/preflight",
]

# Readiness checks: ./bin/repo-mise doctor project. Each check only reads
# state. The platform and profile files add their own checks.
[doctor.checks.mise-tools]
description = "The configured mise tools are installed and start"
run = "bin/check-mise-tools"
hint = "Run ./bin/repo-mise --global install --locked"
timeout = "300s"
