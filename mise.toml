# Files and checkouts for every host. Apply them with ./bin/link-dotfiles.
# mise also loads mise.macos.toml or mise.linux.toml for the platform, and the
# profile file that the ignored .miserc.local.toml selects:
# mise.macowl.toml, mise.air.toml, mise.container.toml, or mise.vm.toml.
# bin/repo-mise requires the pinned mise. A soft minimum only warns, so tools
# in this folder keep working while an older mise is installed.
min_version = { soft = "2026.11.6" }

[dotfiles]
"~/.zshenv" = { source = "configs/zsh/zshenv", mode = "symlink" }
"~/.zprofile" = { source = "configs/zsh/zprofile", mode = "symlink" }
"~/.zshrc" = { source = "configs/zsh/zshrc", mode = "symlink" }
"~/.p10k.zsh" = { source = "configs/zsh/p10k.zsh", mode = "symlink" }
"~/.config/zsh/aliases.zsh" = { source = "configs/zsh/aliases.zsh", mode = "symlink" }
"~/.config/zsh/check-updates.zsh" = { source = "configs/zsh/check-updates.zsh", mode = "symlink" }
"~/.config/zsh/env.zsh" = { source = "configs/zsh/env.zsh", mode = "symlink" }
"~/.config/zsh/functions.zsh" = { source = "configs/zsh/functions.zsh", mode = "symlink" }
"~/.config/zsh/harness.zsh" = { source = "configs/zsh/harness.zsh", mode = "symlink" }
"~/.config/zsh/interactive.zsh" = { source = "configs/zsh/interactive.zsh", mode = "symlink" }
"~/.config/zsh/mise-activate.zsh" = { source = "configs/zsh/mise-activate.zsh", mode = "symlink" }
"~/.config/zsh/mise-npx.zsh" = { source = "configs/zsh/mise-npx.zsh", mode = "symlink" }
"~/.config/zsh/path.zsh" = { source = "configs/zsh/path.zsh", mode = "symlink" }
"~/.config/zsh/profile.zsh" = { source = "configs/zsh/profile.zsh", mode = "symlink" }
"~/.config/zsh/telemetry.sh" = { source = "configs/zsh/telemetry.sh", mode = "symlink" }
"~/.config/bash/mise-activate.bash" = { source = "configs/bash/mise-activate.bash", mode = "symlink" }

"~/.gitconfig" = { source = "configs/git/gitconfig", mode = "symlink" }
"~/bin/gh" = { source = "configs/gh/gh", mode = "symlink" }
"~/bin/dotfiles-gh-real" = { source = "configs/gh/dotfiles-gh-real", mode = "symlink" }

"~/.tmux.conf" = { source = "configs/tmux/tmux.conf", mode = "symlink" }
"~/.rgrc" = { source = "configs/ripgrep/rgrc", mode = "symlink" }
"~/.androidrc" = { source = "configs/android/androidrc", mode = "symlink" }
"~/.config/.bunfig.toml" = { source = "configs/bun/bunfig.toml", mode = "symlink" }
"~/.config/pnpm/config.yaml/dotfiles" = { source = "configs/pnpm/config.yaml", merge = true }
"~/.config/tsrs/tsgo" = { source = "configs/tsrs/tsgo", mode = "symlink" }
"~/.config/nvim" = { source = "nvim", mode = "symlink" }

# The global mise config folder: runtime tools and settings, each profile's
# config.<profile>.toml, and their locks. Its miserc.local.toml links to this
# repository's .miserc.local.toml, so mise loads this machine's profile file.
"~/.config/mise" = { source = "configs/mise/config", mode = "symlink" }

"~/bin/harness" = { source = "configs/harness/harness", mode = "symlink" }
"~/bin/claude" = { source = "configs/claude/claude", mode = "symlink" }
"~/bin/npx" = { source = "configs/npx/npx", mode = "symlink" }
"~/bin/px" = { source = "configs/npx/npx", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "configs/agents/instructions.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "configs/agents/instructions.md", mode = "symlink" }
# These apps rewrite their settings. mise sets only the keys in the sources.
"~/.claude/settings.json/dotfiles" = { source = "configs/claude/settings.json", merge = true }
"~/.codex/config.toml/dotfiles" = { source = "configs/codex/config.toml", merge = true }
# A "/defaults" entry sets a key only when the file has none, so a profile can
# override it. bin/save-settings never saves these sources.
"~/.codex/config.toml/defaults" = { source = "configs/codex/defaults.toml", merge = "missing" }
"~/.t3/userdata/settings.json/dotfiles" = { source = "configs/t3/settings.json", merge = true }
"~/.config/opencode/opencode.json/dotfiles" = { source = "configs/opencode/opencode.json", merge = true }
"~/.pi/agent/settings.json/dotfiles" = { source = "configs/pi/settings.json", merge = true }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", depth = 1 }
"{{ env.ZSH_CUSTOM | default(value='~/.oh-my-zsh/custom') }}/plugins/zsh-fzf-history-search" = { url = "https://github.com/joshskidmore/zsh-fzf-history-search.git", depth = 1 }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm", depth = 1 }
