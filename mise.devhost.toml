# Files for the development machines: every profile except air. The devhost
# environment loads before the profile, so a profile file can replace an entry
# here, as mise.container.toml does for ~/.codex/AGENTS.md.

[dotfiles]
"~/.androidrc" = { source = "configs/android/androidrc", mode = "symlink" }
"~/.config/.bunfig.toml" = { source = "configs/bun/bunfig.toml", mode = "symlink" }

# A link to mise acts as a shim: mise runs the tool that the link name names.
# The Claude and Codex MCP configs start this path. A link to the tool's
# install folder would fail, because setup links files before mise installs
# tools, and one missing source stops the whole apply.
"~/.local/bin/aether" = { source = "~/.local/bin/mise", mode = "symlink" }

"~/.claude/CLAUDE.md" = { source = "configs/agents/instructions.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "configs/agents/instructions.md", mode = "symlink" }
# Agent skills. The skills CLI writes through these two links
# into the repository, so commit configs/agents after `skills add`, `update`,
# or `remove`. Claude Code reads only ~/.claude/skills, so each skill also gets
# a link there. The glob leaves Claude Code's own items in that folder alone.
"~/.agents/skills" = { source = "configs/agents/skills", mode = "symlink" }
"~/.agents/.skill-lock.json" = { source = "configs/agents/skill-lock.json", mode = "symlink" }
"~/.claude/skills/*" = { source = "configs/agents/skills/*", mode = "symlink" }
# These apps rewrite their settings. mise sets only the keys in the sources,
# and creates a missing file with mode 0600, because it can hold tokens.
"~/.t3/userdata/settings.json/dotfiles" = { source = "configs/t3/settings.json", merge = true, permissions = "0600" }
"~/.config/opencode/opencode.json/dotfiles" = { source = "configs/opencode/opencode.json", merge = true, permissions = "0600" }
"~/.pi/agent/settings.json/dotfiles" = { source = "configs/pi/settings.json", merge = true, permissions = "0600" }

# mise keeps a glob link after its source goes away. This hook removes the
# broken skill links, the CLI's (../../.agents/skills/<name>) and mise's. It runs
# after each `mise dot apply` and must not fail: a failure makes
# bin/link-dotfiles undo the apply.
[bootstrap.hooks.post-dotfiles]
description = "Remove broken links in ~/.claude/skills"
run = """
for link in "$HOME"/.claude/skills/* "$HOME"/.claude/skills/.[!.]*; do
  [ -L "$link" ] && [ ! -e "$link" ] || continue
  case "$(readlink "$link" || true)" in
    */.agents/skills/* | */configs/agents/skills/*)
      rm -f "$link" && echo "Removed the broken skill link $link" || true ;;
  esac
done
true
"""

# The macOS preferences of the development Macs. Linux reads this file too, but
# only macos/defaults.sh applies [bootstrap.settings.macos], and only on a Mac.
# mise adds these login items to the list in mise.macos.toml.
[bootstrap.settings.macos.login_items]
apps = [
  "/Applications/AeroSpace.app",
  "/Applications/Expo Orbit.app",
  "/Applications/Vorssaint.app",
]

