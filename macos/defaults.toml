# User preferences that macos/defaults.sh applies with
# `mise bootstrap macos defaults apply`. Each value replaces the whole
# preference, as `defaults write` does. Check drift with:
#   ./bin/repo-mise "$PWD/macos/defaults.toml" bootstrap macos defaults status
# defaults.sh keeps the input sources, the Dock prune, pmset, and app restarts.
# Do not declare login items here: `defaults apply` applies them too.
min_version = "2026.10.17"

[bootstrap.macos.defaults.NSGlobalDomain]
AppleLocale = "en_US@currency=RON"
AppleKeyboardUIMode = 3
ApplePressAndHoldEnabled = false
InitialKeyRepeat = 15
KeyRepeat = 2
NSAutomaticCapitalizationEnabled = false
NSAutomaticDashSubstitutionEnabled = true
NSAutomaticQuoteSubstitutionEnabled = true
NSAutomaticSpellingCorrectionEnabled = false
KB_SpellingLanguage = { KB_SpellingLanguageIsAutomatic = true }
NSSpellCheckerAutomaticallyIdentifiesLanguages = true
"com.apple.keyboard.fnState" = true
"com.apple.mouse.scaling" = 3.0
"com.apple.scrollwheel.scaling" = 1.7
"com.apple.swipescrolldirection" = true
"com.apple.trackpad.forceClick" = false
"com.apple.trackpad.scaling" = 3.0

[bootstrap.macos.defaults."com.apple.assistant.support"]
"Dictation Enabled" = true

[bootstrap.macos.defaults."com.apple.speech.recognition.AppleSpeechRecognition.prefs"]
DictationIMNetworkBasedLocaleIdentifier = "ro_RO"
DictationIMPreferredLanguageIdentifiers = ["ro_RO", "en_US"]
VisibleNetworkSRLocaleIdentifiers = { ro_RO = true, en_US = true }

[bootstrap.macos.defaults."com.apple.AppleMultitouchMouse"]
MouseButtonMode = "OneButton"
MouseHorizontalScroll = true
MouseMomentumScroll = true
MouseOneFingerDoubleTapGesture = 1
MouseTwoFingerHorizSwipeGesture = 2

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
Dragging = false
TrackpadRightClick = true
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadRightClick = true
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXPreferredViewStyle = "Nlsv"
ShowPathbar = true
ShowStatusBar = true

[bootstrap.macos.defaults."com.apple.screencapture"]
"disable-shadow" = true

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
largesize = 51
magnification = true
orientation = "bottom"
"expose-group-apps" = true
tilesize = 34

[bootstrap.macos.defaults."com.apple.ActivityMonitor"]
SortDirection = 1

[bootstrap.macos.defaults."com.apple.SoftwareUpdate"]
AutomaticCheckEnabled = true
AutomaticDownload = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Battery"
host = "current"
value = 19

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

# Turn off the Spotlight shortcuts (Cmd-Space and Cmd-Option-Space) for Raycast.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 1048576] } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65"]
value = { enabled = false, value = { type = "standard", parameters = [32, 49, 1572864] } }
